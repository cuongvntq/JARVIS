[project]
name = "jarvis-backend"
version = "0.1.0"
description = "J.A.R.V.I.S Personal AI Assistant — Backend"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "slowapi>=0.1.9",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",          # cho Alembic (sync)
    "alembic>=1.14.0",
    "pgvector>=0.3.6",

    # Validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=3.2,<4.0",          # passlib incompatible with bcrypt>=4.0
    "google-auth>=2.36.0",

    # LLM
    "litellm>=1.55.0",
    "google-generativeai>=0.8.3",
    "openai>=1.57.0",

    # Datetime VN parsing
    "dateparser>=1.2.0",
    "python-dateutil>=2.9.0",

    # Scheduler
    "apscheduler>=3.11.0",

    # Logging
    "structlog>=24.4.0",

    # Redis (optional — Upstash rate limit store)
    "redis[asyncio]>=5.0.0",

    # Observability
    "sentry-sdk[fastapi]>=2.19.0",

    # HTTP client
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ============= Ruff =============
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line-too-long handled by formatter
    "B008",   # Depends() in default args is idiomatic FastAPI pattern
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ============= Pytest =============
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short -m 'not eval'"
markers = ["eval: prompt evaluation tests (require real LLM keys, set RUN_EVAL=1)"]

# ============= mypy =============
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
